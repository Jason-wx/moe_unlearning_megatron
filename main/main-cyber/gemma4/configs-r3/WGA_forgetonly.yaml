# Gemma4 main-cyber wga configuration (R3 retain-rescue round).
# Derived from configs-r2/WGA_forgetonly.yaml; the ONLY deltas vs R2 are
# (1) the run name (-r3- infix), (2) alpha 0.0 -> 0.1 with the BOS retain
# cache attached, and (3) the save plan emptied. Everything else is
# byte-identical: model gemma-26b-a4b-nocap + BOS caches, lr 5e-6, mbs 4 /
# eval-bs 32, the [23..230] per-epoch eval grid, seed 42, shared
# main-cyber output_root.
# Motivation (R2 readout): forget-only WGA (alpha=0) was the worst collapse
# of the line - MMLU 0.28-0.46 from step 23 on in both rounds while cyber
# reached 0.24-0.26. The detached p^beta weighting concentrates gradient on
# the most-confident forget tokens with nothing pulling capability back.
# This arm re-runs the SAME schedule with a light retain anchor (alpha=0.1,
# the GD-family convention).
# NO checkpoints are saved in this round (diagnostic curve only):
# save_steps [], save_interval_steps 0, save_every_epoch false,
# save_final_checkpoint false - runtime.py has no fallback export.
# NOTE: the file keeps its historical filename (WGA_forgetonly.yaml)
# for script continuity, but the run is no longer forget-only.
name: gemma4-main-cyber-r3-wga
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_cyber_softpack4096_bos/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: wga
  beta: 2.0
  gamma: 1.0
  alpha: 0.1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-main-cyber-r3-wga
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 4
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer; V-cyber ran
      # clean at 32. Fall back to 16 only if the first evaluation forward
      # hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/gemma4/online-evaluation
      steps: [1, 23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
