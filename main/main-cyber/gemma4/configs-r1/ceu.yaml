# Gemma4 main-cyber ceu configuration (G1 curve round).
# Auto-migrated from main/main-cyber/qwen35/ceu.yaml (R2 edition) by
# main/main-cyber/gemma4/make_configs.py - training plan byte-copied
# (cyber-line policy), model switched to gemma-26b-a4b-nocap and caches
# to the BOS variants (the combo whose transfer the BOS ablation
# confirmed on bio GD: 0.79 -> 0.578 by step 300 at lr 1e-6).
# Algorithm section copied unchanged; forget-only (retain null, mbs 1,
# full-logit objective at 2^30 elements - under the int32 cap).
# KNOWN BUG, UNFIXED: CEU's fp32 target normalization amplifies early
# gradients up to ~6e3x on high-confidence tokens (objectives.py:278,
# rootcause section 4.1) - read this run's curve with that in mind; all
# three models' CEU results carry the same caveat.
# G1 round: NO checkpoints anywhere (save_steps [], save_final_checkpoint
# false) - the online-eval curve is the only readout; save points, if
# any, get picked from the curves in a later round (the qwen35-cyber
# R1 -> R2 protocol).
# Schedule / mbs / eval batch_size copied unchanged from the qwen35-cyber
# config: the gemma4 cyber BOS forget cache packs to 748 packs (vs
# intern/qwen 743), and with drop_last floor(748/32) = 23 steps per
# epoch, so 10 epochs = 230 steps and the per-epoch eval [23..230]
# carries over 1:1. Eval bs keeps the qwen35-cyber tiering (32; 16 for
# the full-logit trio gd/pure_npo/simnpo): gemma4's A4B static footprint
# on cyber-length prompts is unmeasured - on first-eval CUDA OOM halve
# it (32 -> 16, 16 -> 8). Output names / online-eval dir under
# main-cyber/gemma4; checkpoint output_root is shared with the intern/
# qwen cyber lines (runs are name-distinct; G1 writes nothing there).
name: gemma4-main-cyber-ceu
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_cyber_softpack4096_bos/forget
  retain_cache: null
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: ceu
  gamma: 1.0
  ignore_first_n_tokens: 1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-main-cyber-ceu
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      # CEU is a full-logit algorithm (no fused CE); activation recomputation
      # keeps the materialized logits within memory budget.
      activation_recompute: full
      use_distributed_optimizer: true
    # CEU does not use a reference model; this block is inert and kept for
    # uniformity.
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer; V-cyber ran
      # clean at 32. Fall back to 16 only if the first evaluation forward
      # hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/gemma4/online-evaluation
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
