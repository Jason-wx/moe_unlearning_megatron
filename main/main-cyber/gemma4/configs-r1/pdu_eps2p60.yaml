# Gemma4 main-cyber pdu_eps2p60 configuration (G1 curve round).
# Auto-migrated from main/main-cyber/qwen35/pdu_eps2p51.yaml (R2 edition) by
# main/main-cyber/gemma4/make_configs.py - training plan byte-copied
# (cyber-line policy), model switched to gemma-26b-a4b-nocap and caches
# to the BOS variants (the combo whose transfer the BOS ablation
# confirmed on bio GD: 0.79 -> 0.578 by step 300 at lr 1e-6).
# This arm: eps = 2.6 (nominal offset +0.51 vs the VOID
# softcap-no-BOS anchor 2.0945 - grid-spacing reference only).
# One of SIX PDU eps arms on this line (absolute grid 2.0 / 2.1 / 2.2 /
# 2.4 / 2.6 / 3.0, decided 2026-10-03; mirrors the softcap bio sweep
# grid with 2.25 -> 2.4 and 2.5 -> 2.6). The nocap x BOS anchor is NOT
# measured: run tools.measure_retain_nll on gemma-26b-a4b-nocap over
# fineweb_edu_5b_gemma4_softpack4096_bos_seed42 alongside this round
# (rjob pattern: main/gemma4/pdu_eps_sweep/rjob_anchor_safethm.sh,
# 4 GPU / ~20-40min) - not a submission blocker, but the curves get read
# against arm-to-anchor offsets; if the anchor lands well above 3.0 the
# whole grid sits on the tight side and a second round re-centers on it.
# Fixed knobs gamma/alpha/dual_step_size = 1.0/1.0/0.1 (V4-validated)
# unchanged. mbs 1 is mandatory on gemma4 (paired full-logits hit the
# 2^31 int32 cap; the split-forward guard auto-engages from config.json
# vocab - GPU-verified, no runner env needed).
# G1 round: NO checkpoints anywhere (save_steps [], save_final_checkpoint
# false) - the online-eval curve is the only readout; save points, if
# any, get picked from the curves in a later round (the qwen35-cyber
# R1 -> R2 protocol).
# Schedule / mbs / eval batch_size copied unchanged from the qwen35-cyber
# config: the gemma4 cyber BOS forget cache packs to 748 packs (vs
# intern/qwen 743), and with drop_last floor(748/32) = 23 steps per
# epoch, so 10 epochs = 230 steps and the per-epoch eval [23..230]
# carries over 1:1. Eval bs keeps the qwen35-cyber tiering (32; 16 for
# the full-logit trio gd/pure_npo/simnpo): gemma4's A4B static footprint
# on cyber-length prompts is unmeasured - on first-eval CUDA OOM halve
# it (32 -> 16, 16 -> 8). Output names / online-eval dir under
# main-cyber/gemma4; checkpoint output_root is shared with the intern/
# qwen cyber lines (runs are name-distinct; G1 writes nothing there).
name: gemma4-main-cyber-pdu-eps2p60
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_cyber_softpack4096_bos/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: pdu
  gamma: 1.0
  alpha: 1.0
  retain_loss_eps: 2.6
  primal_dual: true
  dual_step_size: 0.1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-main-cyber-pdu-eps2p60
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer and PDU keeps a
      # frozen reference resident; V-cyber ran clean at 32. Fall back to 16
      # only if the first evaluation forward hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/gemma4/online-evaluation
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
