# Qwen3.5 main-cyber rmu configuration.
# Auto-migrated from main/main-cyber/interns2/rmu.yaml (R3 plan)
# by main/main-cyber/qwen35/make_configs.py - model switched to
# qwen3p5-35b-a3b (fields from the qwen35 bio main line), caches
# switched to the qwen35 cyber forget pack (plus the qwen35 fineweb
# retain pack where the source wires a retain stream).
# The algorithm section is byte-identical to main/qwen35/rmu.yaml (the
# qwen35 bio main line): alpha 350.0 -> 63.4 (steer 300 unchanged) - the
# intern alpha is NOT portable across models (gemma4 R:F-mismatch
# verdict); 63.4 is the qwen35-calibrated R:F-sweep best arm (bio online
# 0.323/0.817, main/qwen35/... RMU_rf_sweep_report_20260924.md). Only the
# algorithm section is aligned - optimizer/schedule keep the cyber-line
# policy below. Eval bs stays 32: cyber stems are longer than bio's (qwen
# bio ran 96 on bio-length prompts); lower to 16 only on first-eval CUDA
# OOM.
# R2 save point: ONE checkpoint at step 92 (epoch 4) - the margin-best
# point of this run's R1 curve (margin = mmlu - wmdp_cyber, argmax,
# earliest step wins ties). save_final_checkpoint stays false.
# Schedule / mbs / eval batch_size copied unchanged from the intern-cyber
# R3 config: the qwen35 cyber forget cache packs to the same 743 packs,
# so 10 epochs = 230 steps and the per-epoch eval [23..230] carries over
# 1:1. Save-plan history: R1 (2026-10-01 first submission) saved NO
# checkpoints - a pure curve round; its curves then picked each run's
# margin-best step, and this R2 edit (same day) sets save_steps to exactly
# that one point. Final checkpoint stays OFF. Output names / online-eval
# dir under main-cyber/qwen35; checkpoint output_root is shared with the
# intern-cyber line (runs are name-distinct).
name: qwen35-main-cyber-rmu
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_cyber_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: rmu
  gamma: 1.0
  alpha: 63.4
  target_layer: 9
  train_layers: [7, 8, 9]
  steering_coeff: 300.0
  control_norm_mode: fixed
  control_scale_coeff: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-main-cyber-rmu
  save_steps: [92]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 4
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      # RMU extracts and backprops from layer 9. Full-layer checkpointing runs
      # that hook under no-grad and detaches the RMU loss; keep it disabled.
      activation_recompute: null
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer and RMU keeps a
      # frozen reference resident; V-cyber ran clean at 32. Fall back to 16
      # only if the first evaluation forward hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/qwen35/online-evaluation
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
