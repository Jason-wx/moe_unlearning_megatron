# Qwen3.5 main-cyber PDU eps2.51 - epoch-2 save variant (rmu-pdu-tuning line).
# Copied from ../pdu_eps2p51.yaml (the R2 margin-best config) with ONLY the
# four things this tuning round changes:
#   - save point: step 115 (epoch 5) -> step 46 (epoch 2). 23 steps/epoch,
#     so epoch 2 = step 46. save_final_checkpoint stays false.
#   - run name / output_name: suffixed -ep2 so this ckpt does NOT collide
#     with the existing R2 pdu-eps2p51 s115 export.
#   - checkpoint output_root: now points directly at .../main-cyber/qwen35
#     (the run name provides the per-run subfolder underneath).
#   - online-eval output_dir: .../online-evaluation/g3 (this round's curves).
# Everything else - model, caches, algorithm (eps 2.51, dual_step_size 0.1,
# primal_dual), schedule, mbs 1, eval bs 32, eval steps - is byte-identical
# to ../pdu_eps2p51.yaml.
name: qwen35-main-cyber-pdu-eps2p51-ep2
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_cyber_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: pdu
  gamma: 1.0
  alpha: 1.0
  retain_loss_eps: 2.51
  primal_dual: true
  dual_step_size: 0.1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-main-cyber-pdu-eps2p51-ep2
  save_steps: [46]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber/qwen35
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer and PDU keeps a
      # frozen reference resident; V-cyber ran clean at 32. Fall back to 16
      # only if the first evaluation forward hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/qwen35/online-evaluation/g3
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
