# Intern-S2 main-cyber PDU configuration (unified lr 1e-6 point).
# Migrated from main/interns2/pdu.yaml (bio line; selected ckpt
# interns2-main-pdu-step2142, offline 0.311/0.784): dataset switched to
# wmdp_cyber, everything else unchanged except the training plan. Round 1
# (10 epochs / 230 steps, 2026-09-30) held cyber ~0.25 from epoch 4 while
# mmlu slid 0.86 -> 0.77 late. Round 2 truncated to 3 epochs; PDU was the
# least schedule-sensitive (0.284/0.854 vs R1 0.288/0.857) but for
# uniformity round 3 reverts ALL nine configs to the exact R1 schedule -
# 10 epochs = 230 steps, per-epoch eval [23..230] - saving ONLY the chosen
# step ckpt (save_steps [69], no final save).
# NOTE: the summary table also keeps pdu_lr4e-6 (bio 0.408/0.844) as PDU's
# representative working point; not migrated per the 10-ckpt selection.
# eps=2.05 was tuned at lr 4e-6 - the cyber-line unified lr 5e-6 stays
# close to that tuning regime (unlike bio's lr 1e-6, where the dual
# variable decayed to ~0 and the constraint never bound).
# mbs is 1 (not 4): PDU is a full-logit algorithm and OOM'd at mbs 4 after
# step 1 (~15.3 GiB full-vocab fp32 allocation; bio-line evidence
# 2026-09-24). gbs stays 32, so the optimization math is unchanged.
# eval batch_size 64 -> 32: cyber question stems are longer; V-cyber ran
# clean at 32.
# lr 1e-6 -> 5e-6 per the cyber-line decision (PureNPO and SimNPO keep 5e-5).
# min_learning_rate 0 -> 1e-6 for all ten configs (cosine floor, 2026-09-30).
name: interns2-main-cyber-pdu
model:
  name: interns2
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/intern/Intern-S2-base05
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/interns2_wmdp_cyber_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_interns2_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: pdu
  gamma: 1.0
  alpha: 1.0
  retain_loss_eps: 2.05
  primal_dual: true
  dual_step_size: 0.1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: interns2-main-cyber-pdu
  save_steps: [69]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer and PDU keeps a
      # frozen reference resident; V-cyber ran clean at 32. Fall back to 16
      # only if the first evaluation forward hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/interns2/online-evaluation
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
