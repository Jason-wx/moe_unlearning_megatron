# Intern-S2 main-cyber PureNPO configuration.
# Migrated from main/interns2/pure_npo.yaml (bio line; selected ckpt
# interns2-main-pure-npo-step2142, offline 0.763/0.788): dataset switched
# to wmdp_cyber, everything else unchanged except the training plan.
# Round 1 (10 epochs / 230 steps, 2026-09-30) bottomed at epoch 3 (cyber
# 0.387 / mmlu 0.841) then bounced back to ~0.43. Round 2 truncated to
# 3 epochs (bottomed at ep1 0.381, endpoint 0.442/0.853). Round 3: back to
# the exact R1 schedule - 10 epochs = 230 steps, per-epoch eval [23..230] -
# saving ONLY the chosen step ckpt (save_steps [69], no final save).
# lr 5e-5 (decaying cosine) taken from the V-final main-comparison run; the
# bio 1-epoch run finished 77.5 bio / 84.0 mmlu (weak forgetting).
# mbs is 1 (not 4): Megatron vocab_parallel_cross_entropy materializes
# full fp32 logits (~30.7 GiB at mbs 4) on top of ~128 GiB static (frozen
# reference resident) - OOM at step 2, bio-line evidence 2026-09-24 twice.
# gbs stays 32; optimization math unchanged.
# min_learning_rate 0 -> 1e-6 for all ten configs (cosine floor, 2026-09-30).
name: interns2-main-cyber-pure-npo
model:
  name: interns2
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/intern/Intern-S2-base05
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/interns2_wmdp_cyber_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_interns2_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: pure_npo
  beta: 0.1
  gamma: 1.0
  alpha: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-05
  weight_decay: 0.0
  # Cosine decays from 5e-5 toward the 1e-6 floor over the full schedule
  # (bio-line PureNPO decayed to 0).
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: interns2-main-cyber-pure-npo
  save_steps: [69]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # Eval bs 16 (unchanged from bio): PureNPO keeps a frozen reference
      # resident; the step-1 eval forward OOMs at batch_size=64 (~30.7 GiB
      # full-vocab eval logits on top of ~128 GiB static). Static footprint
      # is dataset-independent.
      batch_size: 16
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/interns2/online-evaluation
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
