# Qwen3.5 PDU eps-sweep arm (auto-generated by make_eps_configs.py — do not
# hand-edit the eps value; regenerate instead).
# Anchor: baseline retain NLL = 2.0082 (pooled, 800 packs /
# 3146559 valid tokens, tools.measure_retain_nll on the sgtm
# qwen3p5-35b-a3b init over the softpack4096 retain cache; see
# retain_nll_anchor_qwen35.json).
# Arm: eps = anchor -0.03 = 1.98 — below-anchor probe (anchor-0.028, only arm with positive initial violation ~+0.03: lambda must actively compress retain NLL below baseline, mild V3-death-mode analog) + intern V4 best-arm absolute value for cross-model comparison
# Fixed knobs (V4-validated): gamma=1.0, alpha(lambda0)=1.0,
# dual_step_size(eta)=0.1, lr 4e-6 (intern main-line lr x eps coupling:
# at 1e-6 the dual variable never binds and MMLU erodes).
# Main-line recipe: gbs 32 / mbs 1 (full-logit OOM at mbs 4) / 3 ep = 2142
# steps, cosine + 5% warmup, seed 42, online eval, final ckpt saved.
name: qwen35-pdu-eps1p98
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_bio_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: pdu
  gamma: 1.0
  alpha: 1.0
  retain_loss_eps: 1.98
  primal_dual: true
  dual_step_size: 0.1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 4.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-pdu-eps1p98
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/qwen35/pdu_eps_sweep
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # Eval batch_size 64 was safe for PDU on Intern-S2 (mbs 1 static
      # profile); lower to 16 only if the first eval forward hits CUDA OOM.
      batch_size: 64
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/qwen35/pdu_eps_sweep/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2142]
