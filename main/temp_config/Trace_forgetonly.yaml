# TRACE forget-only config for Intern-S2, cleaned for the A_Baseline
# archive (2026-09-29): derived from
# TRACE/configs/training/forget_only/interns2/intern_s2_base05_forget1_lr1e-6_ep2_ep8_mb4_gb32.yaml
# with the checkpoint plan reduced to final-only — only step 1428 (= 2
# epochs, gbs 32) is exported via checkpoint_cadence steps +
# checkpoint_steps [1428], matching the archived weight. The producing run
# used cadence "epoch" and also exported step 714; run/output names kept
# unchanged for traceability.
model:
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/Intern-S2-base05
  num_experts: 256
  trust_remote_code: true

data:
  forget_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/interns2_wmdp_bio_softpack4096/forget
  retain_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/fineweb_edu_5b_interns2_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false

# 8 GPUs: TP(1) * PP(1) * CP(1) * DP(8) = 8.
# Expert groups: ETP(1) * EP(8) * PP(1) * expert-DP(1) = 8.
# Each rank owns 256/8=32 routed experts per layer.
parallel:
  world_size: 8
  tensor_parallel: 1
  pipeline_parallel: 1
  context_parallel: 1
  expert_parallel: 8
  expert_tensor_parallel: 1
  sequence_parallel: false
  # Keep the TP1/EP8 memory-safe path: checkpoint every transformer layer and
  # recompute it during backward. Without this, micro_batch_size=4 retains
  # activations for all 40 layers and OOMs during MoE dispatch on 140 GiB H200.
  activation_recompute: full
  use_distributed_optimizer: true

optimizer:
  learning_rate: 1.0e-6
  weight_decay: 0.0
  gradient_clip: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8

training:
  # DP(8) * micro_batch(4), with one microbatch per optimizer step.
  micro_batch_size: 4
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 2
  seed: 42
  bf16: true
  output_dir: outputs/intern_s2_base05_forget1_lr1e-6_ep2_ep8_mb4_gb32_forgetonly

trace:
  selection_metadata: outputs/intern_s2_base05_wmdp_bio_softpack4096_expert_selection/metadata.json
  # Forget-only ablation: the retain objective is disabled. The current
  # implementation still constructs and solves the retain calibration problem,
  # then multiplies its weighted retain loss by zero.
  lambda_forget: 1.0
  lambda_retain: 0.0
  gamma: 1.0e-5
  pgd_learning_rate: 700
  pgd_max_steps: 200
  pgd_tolerance: 1.0e-6
  alpha_min: 1.0
  moe_grouped_gemm: false
  checkpoint_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/Trace
  resume_from: null
  # A_Baseline archive keeps only the final HF checkpoint: step 1428 for the
  # 22,864-pack forget cache with global batch size 32 (2 epochs).
  save_checkpoints: true
  checkpoint_cadence: steps
  checkpoint_steps: [1428]
