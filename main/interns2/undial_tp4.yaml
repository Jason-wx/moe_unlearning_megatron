# Intern-S2 main UNDIAL on the V3-proven layout (forget-only: retain_cache
# null, alpha=0). Training plan is the main-line standard — gbs 32 / lr 1e-6
# / 3 epochs = 2142 steps, cosine to 0, online eval, final ckpt — but the
# parallel layout is TP4/PP2/EP4 + sequence_parallel, copied from the
# historically verified configs/training/megatron/interns2/undial_mbs1_ga4.yaml
# (which trained 1 epoch and was lm_eval'd: V3 undial 0.821 bio / 0.840 mmlu).
# Why not the main-line TP1/EP8: undial is the only algorithm that is BOTH
# full-logit AND reference-resident — on TP1/EP8 at mbs1 the objective
# materializes ~8 full-vocab fp32 tensors (~30.7 GiB transient) on top of
# ~136 GiB static, OOM at step 2 three times (2026-09-23/24). TP4 shards the
# vocab 4x (0.96 GiB per tensor) and PP2 halves the resident student+teacher;
# the objective code's tp_size>1 branches handle this. Layout does not change
# the optimization math (same gbs/lr/schedule/seed). mbs 1, logit_window 1 as
# in the V3 run; activation_recompute stays full (extra safety, compatible —
# the TP1 attempts always got past forward/backward before the objective OOM).
name: interns2-main-undial-tp4
model:
  name: interns2
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/intern/Intern-S2-base05
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/interns2_wmdp_bio_softpack4096/forget
  retain_cache: null
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: undial
  beta: 3.0
  gamma: 1.0
  alpha: 0.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 1.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: interns2-main-undial-tp4
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 4
      pipeline_parallel: 2
      context_parallel: 1
      expert_parallel: 4
      expert_tensor_parallel: 1
      sequence_parallel: true
      # UNDIAL is a full-logit algorithm (no fused CE) and keeps a frozen
      # reference resident; activation recomputation is required on this
      # layout.
      activation_recompute: full
      use_distributed_optimizer: true
    # UNDIAL is a reference algorithm: a frozen reference model IS built.
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 1
    evaluation:
      # Disabled: online eval hard-requires pipeline_parallel==1 (config
      # guard, ValueError at launch — first undial-tp4 attempt 2026-09-24
      # 17:25). V3 precedent: save the final ckpt, lm_eval offline.
      enabled: false
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # Same unified online-eval batch size as the rest of the main line.
      # UNDIAL keeps a frozen reference resident; the step-1 eval forward
      # OOMs at batch_size=64 (verified 2026-09-24, ~136 GiB in use); 16 is
      # the pre-planned fallback. Training stays mbs 1.
      batch_size: 16
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/interns2/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2142]
