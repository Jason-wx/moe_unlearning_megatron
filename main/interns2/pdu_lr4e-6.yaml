# Intern-S2 main PDU at its V-final-validated working point: lr 4e-6.
# Identical to pdu.yaml except learning_rate (1e-6 -> 4e-6). Rationale
# (2026-09-24, after the lr1e-6 run finished 0.277/0.742): PDU's eps=2.05
# was tuned under lr4e-6 primal dynamics — the dual variable only ratchets
# up when the fast-moving primal trips the retain constraint. At lr1e-6 the
# constraint never binds hard (lambda decays to ~0 by step 50, peak 13 vs
# 19.5), so the last ~1100 steps run as unregularized forget-ascent and MMLU
# erodes 0.840 -> 0.732. The V-final 3ep run (this exact config: gbs32/mbs1/
# 3ep=2142, eps 2.05, dual 0.1, lr 4e-6) landed 0.335 bio / 0.848 mmlu.
# The lr1e-6 run is kept as the unified-lr data point, not overwritten.
# mbs is 1 (not 4): PDU is a full-logit algorithm and OOM'd at mbs 4 after
# step 1 (~15.3 GiB full-vocab fp32 allocation; verified 2026-09-24, g2 job
# 47604321). gbs stays 32, so the optimization math is unchanged.
name: interns2-main-pdu-lr4e-6
model:
  name: interns2
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/checkpoints/intern/Intern-S2-base05
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/interns2_wmdp_bio_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_interns2_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: pdu
  gamma: 1.0
  alpha: 1.0
  retain_loss_eps: 2.05
  primal_dual: true
  dual_step_size: 0.1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 4.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: interns2-main-pdu-lr4e-6
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # Same unified online-eval batch size as V-final. Lower this to 16 only
      # if the first evaluation forward hits CUDA OOM.
      batch_size: 64
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/interns2/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2142]
