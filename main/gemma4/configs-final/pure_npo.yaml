# Gemma4 FINAL line — nocap shadow model + BOS-anchored caches, final ckpt
# saved. Regime proven by the 10-03 BOS ablation (GD 0.79->0.273/0.725 with
# MMLU -4.2pt while every no-BOS run froze at 0.78-0.80); all pre-BOS
# gemma4-bio results are superseded. Online-eval records ->
# main/gemma4/configs-final/online-evaluation/; weights ->
# /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main/<output_name>/checkpoint-step-2133 (~66G each).
# Base: main/gemma4/pure_npo.yaml — lr 5e-5 is the ONLY effective
# bracket on gemma4 (1e-5/1e-6 arms dead, 09-30). Caveat: the
# qwen35/gemma4 pure_npo carries an alpha=1.0 retain-CE anchor
# (intern main is forget-only) — cross-model comparisons discounted.
name: gemma4-final-pure-npo-nocap
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_bio_softpack4096_bos/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: pure_npo
  beta: 0.1
  gamma: 1.0
  alpha: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 5.0e-05
  weight_decay: 0.0
  # Cosine decays from 5e-5 to 0 over the full 2133 steps, matching the
  # intern main-line PureNPO schedule.
  min_learning_rate: 0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-final-pure-npo-nocap
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # PureNPO keeps a frozen reference resident: eval batch_size 16 is the
      # Intern-S2-verified fallback for this static profile (64 OOM'd).
      batch_size: 16
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/gemma4/configs-final/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2133]
