# Gemma4 BOS-ablation GradAscent — NOCAP, BOS-anchored caches.
# A/B arm against main/gemma4/grad_ascent_nocap.yaml (the no-BOS baseline,
# eval frozen at ~0.79/0.76 while train NLL ran to 3639 — a transfer, not an
# optimization, failure; see main/gemma4/GA_family_nocap_rootcause_20261002.md).
# The ONLY functional change vs that baseline: both caches are the bos_per_pack
# variants, where every 4096-token pack starts with <bos> (verified = old
# caches shifted by one token with BOS at the head, all else identical). This
# matches how Gemma4 is prompted at evaluation time; hypothesis under test is
# that the GA damage was gated to the no-BOS training regime.
# Model stays on the nocap shadow dir (softcap nulled via config.json).
name: gemma4-bos-grad-ascent-nocap
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_bio_softpack4096_bos/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: grad_ascent
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 1.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-bos-grad-ascent-nocap
  save_steps: []
  save_interval_steps: 0
  # Diagnostic A/B: the online-eval curve is the readout; no checkpoint
  # artifacts (saves ~66G per arm).
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 4
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # Forget-only objective, no reference resident: batch_size 64 was safe
      # on the baseline nocap gemma4 run (same static profile).
      batch_size: 64
      # BOS-ablation online-eval records stay inside this line's directory.
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/gemma4/bos-ablation/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2133]
