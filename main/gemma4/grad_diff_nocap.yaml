# Gemma4 main GradDiff — NOCAP rerun (softcap disabled).
# See grad_ascent_nocap.yaml header and
# main/gemma4/GA_family_softcap_analysis_20260930.md for why the capped run
# (weights deleted 2026-09-30) only measured the softcap.
# Algorithm hyperparams and training plan unchanged: γ=1.0 / α=1.0, gbs 32 /
# lr 1e-6 / 3 epochs = 2133 optimizer steps on TP1/PP1/EP8.
# mbs stays 1 (not 4): the frozen reference plus the retain stream keep a
# heavy static footprint, and vocab_parallel_cross_entropy materializes
# full fp32 logits (mbs 4 x seq 4096 x vocab 262144 ~= 17 GiB per microbatch
# in fp32) — the capped gemma4 run used mbs 1 for exactly this reason.
# gbs stays 32, so the optimization math is unchanged.
name: gemma4-main-grad-diff-nocap
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_bio_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: grad_diff
  gamma: 1.0
  alpha: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 1.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-main-grad-diff-nocap
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # GradDiff keeps a frozen reference resident, but the mbs-1 static
      # profile leaves enough headroom: eval batch_size 64 (was 16 as the
      # conservative fallback on earlier lines; raised 2026-09-30 to match
      # the rest of the family — eval speed only, no effect on scores).
      batch_size: 64
      # NOCAP runs keep their online-eval records separate from the capped
      # line (which stays in main/gemma4/online-evaluation).
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/gemma4/online-evaluation/nocap
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2133]
