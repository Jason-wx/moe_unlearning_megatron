defaults:
  model: interns2
  dataset: interns2_wmdp_bio
  algorithm: grad_diff
  profile: deepspeed_aligned_npo
  backends:
    deepspeed: zero3_h200
    megatron: tp4_pp2_ep4_h200

name: interns2-retain-mbs8-wmdp-bio
backends:
  deepspeed:
    micro_batch_size: 4
  megatron:
    # Retain algorithms concatenate forget and retain examples, so this
    # becomes a physical micro batch of 16 while preserving GBS=128.
    micro_batch_size: 8

training:
  output_dir: ${OU_CHECKPOINT_ROOT}/interns2-retain-mbs8-wmdp-bio
