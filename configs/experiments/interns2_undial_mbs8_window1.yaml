defaults:
  model: interns2
  dataset: interns2_wmdp_bio
  algorithm: undial
  profile: deepspeed_aligned_npo
  backends:
    deepspeed: zero3_h200
    megatron: tp4_pp2_ep4_h200

name: interns2-undial-mbs8-window1-wmdp-bio
backends:
  deepspeed:
    micro_batch_size: 4
  megatron:
    micro_batch_size: 8
    reference:
      # UNDIAL retains TP-sharded full-vocabulary reference logits. Process
      # one reference/student microbatch at a time to bound their peak memory.
      logit_window_microbatches: 1

training:
  output_dir: ${OU_CHECKPOINT_ROOT}/interns2-undial-mbs8-window1-wmdp-bio
