# @package _global_

defaults:
  - /data: unlearn
  - /collator: DataCollatorForSupervisedDataset
  - /eval: lm_eval
  - /hydra: default
  - /paths: default
  - override /data/datasets@data.forget: WMDP_forget
  - override /data/datasets@data.retain: WMDP_retain
  - _self_

mode: unlearn
task_name: gemma4_moe_rmu_${data_split}_l${hook_layer}

model_path: /mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/zskj-hub/models--google--gemma-4-26B-A4B
wmdp_data_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/data/wmdp
data_split: cyber
hook_layer: 9
train_layers_regex: 7|8|9

model:
  model_handler: AutoModelForMultimodalLM
  model_args:
    pretrained_model_name_or_path: ${model_path}
    dtype: bfloat16
    trust_remote_code: true
  tokenizer_args:
    pretrained_model_name_or_path: ${model_path}
    trust_remote_code: true
  template_args:
    apply_chat_template: false

data:
  anchor: forget
  forget:
    WMDP_forget:
      args:
        hf_args:
          path: parquet
          data_files: ${wmdp_data_root}/${data_split}-forget-corpus/*.parquet
          split: train
        text_key: text
        max_length: 1024
        stride: null
        min_length: 1
        drop_last: false
        tokenize_batch_size: 64
  retain:
    WMDP_retain:
      args:
        hf_args:
          path: parquet
          data_files: ${wmdp_data_root}/${data_split}-retain-corpus/*.parquet
          split: train
        text_key: text
        max_length: 1024
        stride: null
        min_length: 1
        drop_last: false
        tokenize_batch_size: 64

eval:
  lm_eval:
    tasks:
      - wmdp_${data_split}
      - mmlu

collator:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: left

trainer:
  handler: GemmaMoeRMU
  args:
    output_dir: ${paths.output_dir}
    do_train: true
    do_eval: false
    remove_unused_columns: false
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 5e-5
    max_steps: 80
    lr_scheduler_type: constant
    warmup_steps: 0
    logging_steps: 1
    save_strategy: steps
    save_steps: 80
    save_total_limit: 1
    bf16: true
    gradient_checkpointing: false
    ddp_find_unused_parameters: true
    report_to: tensorboard
    seed: 42
  method_args:
    gamma: 1.0
    alpha: 1200.0
    steering_coeff: 6.5
    control_norm_mode: ref_activation_l2
    control_scale_coeff: 1.0
    retain_loss_type: EMBED_DIFF
    module_regex: model\.language_model\.layers\.${hook_layer}
    trainable_params_regex:
      - model\.language_model\.layers\.(${train_layers_regex})\.experts\.(gate_up_proj|down_proj)
      - model\.language_model\.layers\.(${train_layers_regex})\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    log_trainable_params: true
