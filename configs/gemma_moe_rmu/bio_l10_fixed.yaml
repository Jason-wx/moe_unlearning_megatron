# @package _global_

defaults:
  - unlearn
  - _self_

task_name: gemma4_moe_rmu_bio_l10_fixed
data_split: bio
hook_layer: 9
train_layers_regex: 7|8|9

trainer:
  args:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 2
    gradient_checkpointing: false
    learning_rate: 1e-5
    max_steps: -1
    num_train_epochs: 1
    warmup_steps: 0
    logging_steps: 1
    save_strategy: epoch
    save_total_limit: 1
    seed: 42
  method_args:
    gamma: 1.0
    alpha: 350.0
    steering_coeff: 300.0
    control_norm_mode: fixed
    control_scale_coeff: 1.0
    retain_loss_type: EMBED_DIFF
    module_regex: model\.language_model\.layers\.9
    trainable_params_regex:
      - model\.language_model\.layers\.(7|8|9)\.experts\.(gate_up_proj|down_proj)
      - model\.language_model\.layers\.(7|8|9)\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    log_trainable_params: true
