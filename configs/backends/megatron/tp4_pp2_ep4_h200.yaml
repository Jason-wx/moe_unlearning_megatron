backends:
  megatron:
    enabled: true
    output_root: ${OU_MEGATRON_CHECKPOINT_ROOT:-/mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron}
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 4
      pipeline_parallel: 2
      context_parallel: 1
      expert_parallel: 4
      expert_tensor_parallel: 1
      sequence_parallel: true
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    supported_algorithms: [grad_ascent, grad_diff, npo, token_npo, simnpo, wga, satimp, ceu, pdu, undial, rmu]
