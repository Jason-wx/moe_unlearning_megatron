backends:
  megatron:
    enabled: true
    output_root: ${OU_MEGATRON_CHECKPOINT_ROOT:-/mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron}
    micro_batch_size: 1
    parallel:
      world_size: 6
      tensor_parallel: 2
      pipeline_parallel: 3
      context_parallel: 1
      expert_parallel: 2
      expert_tensor_parallel: 1
      sequence_parallel: true
      use_distributed_optimizer: true
      # RMU PP ranks receive layers 0-6, 7-9, and 10-39 respectively.
      num_layers_in_first_pipeline_stage: 7
      num_layers_in_last_pipeline_stage: 30
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    supported_algorithms: [grad_ascent, grad_diff, npo, token_npo, simnpo, wga, satimp, ceu, pdu, undial, rmu]
