model:
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/internal/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true

data:
  forget_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/qwen35_wmdp_bio_softpack4096/forget
  retain_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false

# Same topology as Intern-S2-base05 (40 routed layers x 256 experts, top-K=8),
# so the validated memory-safe TP1/EP8 layout applies unchanged.
# 8 GPUs: TP(1) * PP(1) * CP(1) * DP(8) = 8.
# Expert groups: ETP(1) * EP(8) * PP(1) * expert-DP(1) = 8.
# Each rank owns 256/8=32 routed experts per layer. Checkpoint every transformer
# layer and recompute it during backward; otherwise micro_batch_size=4 retains
# activations for all 40 layers and OOMs during MoE dispatch on 140 GiB H200.
parallel:
  world_size: 8
  tensor_parallel: 1
  pipeline_parallel: 1
  context_parallel: 1
  expert_parallel: 8
  expert_tensor_parallel: 1
  sequence_parallel: false
  activation_recompute: full
  use_distributed_optimizer: true

optimizer:
  learning_rate: 1.0e-6
  weight_decay: 0.0
  gradient_clip: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8

training:
  # DP(8) * micro_batch(4), with one microbatch per optimizer step.
  micro_batch_size: 4
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  seed: 42
  bf16: true
  output_dir: outputs/qwen35_35b_a3b_wmdp_bio_forget1_lr1e-6_ep3_ep8_mb4_gb32_forgetonly

trace:
  # Run configs/expert_selection/qwen35_wmdp_bio_softpack4096.yaml first;
  # Qwen3.5-critical experts must not reuse the Intern-S2 selection.
  selection_metadata: outputs/qwen35_wmdp_bio_softpack4096_expert_selection/metadata.json
  # Forget-only ablation: the retain objective is disabled. The current
  # implementation still constructs and solves the retain calibration problem,
  # then multiplies its weighted retain loss by zero.
  lambda_forget: 1.0
  lambda_retain: 0.0
  gamma: 1.0e-5
  pgd_learning_rate: 700
  pgd_max_steps: 200
  pgd_tolerance: 1.0e-6
  alpha_min: 1.0
  moe_grouped_gemm: false
  checkpoint_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/Trace
  resume_from: null
  # Export one complete HF checkpoint at each epoch boundary: steps 714, 1428,
  # and 2142 for the 22,864-pack forget cache with global batch size 32.
  save_checkpoints: true
  checkpoint_cadence: epoch
  checkpoint_steps: []
