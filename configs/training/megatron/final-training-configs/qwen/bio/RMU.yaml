# Qwen3.5 main RMU - alpha x10 tuning copy of ./rmu.yaml.
# Copied verbatim from main/qwen35/rmu.yaml (the tuned R:F-sweep best arm,
# steer 300 / R:F 0.005, bio main line: gbs 32 / 3 ep = 2142 steps, lr 1e-6,
# cosine + 5% warmup, seed 42). This copy changes ONLY:
#   - algorithm alpha: 63.4 -> 634.0 (x10).
#   - online eval: last step only (steps [2142]) and FULL-SIZE on both tasks
#     (task_limits removed so MMLU runs all 14042; wmdp_bio was already full).
#   - run name / output_name: suffixed -alpha634 (ckpt does not collide with
#     the existing qwen35-main-rmu export).
#   - checkpoint output_root: .../checkpoints/unlearn/megatron/main/Qwen35.
# Everything else - model, caches, schedule, optimizer, mbs 4, parallel,
# the final-ckpt save plan (save_steps [] + save_final_checkpoint true =
# one ckpt at the last step), online-eval output_dir - is unchanged.
# activation_recompute must stay null: RMU extracts and backprops from layer 9
# and full-layer checkpointing runs that hook under no-grad (config guard).
name: qwen35-main-rmu-alpha634
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/internal/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_bio_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: rmu
  gamma: 1.0
  alpha: 634.0
  target_layer: 9
  train_layers: [7, 8, 9]
  steering_coeff: 300.0
  control_norm_mode: fixed
  control_scale_coeff: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 1.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-main-rmu-alpha634
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main/Qwen35
    micro_batch_size: 4
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      # RMU extracts and backprops from layer 9. Full-layer checkpointing runs
      # that hook under no-grad and detaches the RMU loss; keep it disabled.
      activation_recompute: null
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # Full-size on both tasks this round: wmdp_bio full + MMLU full (14042).
      # task_limits omitted entirely -> limit_for() falls back to limit=None
      # -> no cap on either task (was {mmlu: 35}; verified in config.py).
      # 96 was verified on the qwen35 RMU sweep arms (mbs 4 + frozen reference
      # resident). Full MMLU is more batches, same per-batch memory; lower to
      # 64/16 only if the eval forward hits CUDA OOM.
      batch_size: 96
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/qwen35/online-evaluation
      # Last step only (3 epochs = 2142 steps; 22864 packs / gbs 32 = 714/epoch).
      steps: [2142]
