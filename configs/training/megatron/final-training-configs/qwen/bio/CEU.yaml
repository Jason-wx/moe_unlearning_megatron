# Qwen3.5 main CEU configuration (forget-only, like the intern main line:
# retain_cache null — CEU's objective has no retain term).
# Copied from main/interns2/ceu.yaml (algorithm hyperparams and training
# plan unchanged): γ=1.0 / ignore_first_n_tokens=1, gbs 32 / lr 1e-6 /
# 3 epochs = 2142 optimizer steps on the TP1/PP1/EP8 layout; final
# checkpoint auto-saved.
# mbs is 1 (not 4): CEU materializes several full-vocab fp32 logit tensors
# ([mbs*4096, ~248k] each; qwen35 pad 248044 carries the same math) and
# OOM'd on 140G H200 at mbs 4 on Intern-S2 (verified 2026-09-23).
# gbs stays 32, so the optimization math is unchanged.
name: qwen35-main-ceu
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/internal/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_bio_softpack4096/forget
  retain_cache: null
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: ceu
  gamma: 1.0
  ignore_first_n_tokens: 1
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 1.0e-06
  weight_decay: 0.0
  min_learning_rate: 0.0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-main-ceu
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      # CEU is a full-logit algorithm (no fused CE); activation recomputation
      # keeps the materialized logits within memory budget.
      activation_recompute: full
      use_distributed_optimizer: true
    # CEU does not use a reference model; this block is inert and kept for
    # uniformity.
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # Eval batch_size 64 was safe for CEU on Intern-S2 (mbs 1 static
      # profile); lower to 16 only if the first eval forward hits CUDA OOM.
      batch_size: 64
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/qwen35/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2142]
