# Qwen3.5 main PureNPO configuration.
# Copied from main/interns2/pure_npo.yaml (algorithm hyperparams and
# training plan unchanged): gbs 32 / lr 5e-5 (cosine decays to 0) /
# 3 epochs = 2142 optimizer steps on the TP1/PP1/EP8 layout; final
# checkpoint auto-saved. lr 5e-5 is the intern main-line working point
# (V-final validated; lr 5e-6 PureNPO was judged ineffective on intern).
# mbs is 1 (not 4): Megatron vocab_parallel_cross_entropy materializes full
# fp32 logits (~30.7 GiB at mbs 4) on top of the frozen reference resident —
# OOM at step 2 on Intern-S2, verified 2026-09-24 twice; qwen35 shares the
# same vocab (pad 248044) / seq 4096 materialization math. gbs stays 32.
name: qwen35-main-pure-npo
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/internal/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_bio
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_bio_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: pure_npo
  beta: 0.1
  gamma: 1.0
  alpha: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  learning_rate: 5.0e-05
  weight_decay: 0.0
  # Cosine decays from 5e-5 to 0 over the full 2142 steps, matching the
  # intern main-line PureNPO schedule.
  min_learning_rate: 0
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-main-pure-npo
  save_steps: []
  save_interval_steps: 0
  save_final_checkpoint: true
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_bio, mmlu]
      num_fewshot: 0
      # WMDP-Bio remains full-size; MMLU uses 35 questions per leaf subtask.
      task_limits: {mmlu: 35}
      # PureNPO keeps a frozen reference resident: eval batch_size 16 is the
      # Intern-S2-verified fallback for this static profile (64 OOM'd).
      batch_size: 16
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/qwen35/online-evaluation
      steps: [1, 300, 700, 1000, 1400, 1700, 1800, 1900, 2000, 2100, 2142]
