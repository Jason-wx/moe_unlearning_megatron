# Qwen3.5 main-cyber RMU - alpha-x10 tuning variant (rmu-pdu-tuning line).
# Copied from ../rmu.yaml (the R2 margin-best config). This round changes:
#   - algorithm alpha: 63.4 -> 634.0 (x10 - stronger retain anchor sweep).
#   - save point: step 92 (epoch 4). 23 steps/epoch, so epoch 4 = step 92.
#     save_final_checkpoint stays false (one ckpt only).
#   - run name / output_name: suffixed -ep2 (kept from the first draft; does
#     NOT collide with the existing R2 rmu s92 export, which is name `-rmu`).
#   - checkpoint output_root: points directly at .../main-cyber/qwen35
#     (the run name provides the per-run subfolder underneath).
#   - online-eval output_dir: .../online-evaluation/g3 (this round's curves).
# Everything else - model, caches, steer 300, target_layer 9,
# train_layers [7,8,9], schedule, mbs 4, eval bs 32, eval steps - is
# byte-identical to ../rmu.yaml.
name: qwen35-main-cyber-rmu-ep2
model:
  name: qwen35
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/internal/checkpoints/qwen/qwen3p5-35b-a3b
  num_experts: 256
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/qwen35_wmdp_cyber_softpack4096/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  sequence_length: 4096
  pad_token_id: 248044
  shuffle: false
algorithm:
  name: rmu
  gamma: 1.0
  alpha: 634.0
  target_layer: 9
  train_layers: [7, 8, 9]
  steering_coeff: 300.0
  control_norm_mode: fixed
  control_scale_coeff: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: qwen35-main-cyber-rmu-ep2
  save_steps: [92]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber/qwen35
    micro_batch_size: 4
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      # RMU extracts and backprops from layer 9. Full-layer checkpointing runs
      # that hook under no-grad and detaches the RMU loss; keep it disabled.
      activation_recompute: null
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer and RMU keeps a
      # frozen reference resident; V-cyber ran clean at 32. Fall back to 16
      # only if the first evaluation forward hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/qwen35/online-evaluation/g3
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
