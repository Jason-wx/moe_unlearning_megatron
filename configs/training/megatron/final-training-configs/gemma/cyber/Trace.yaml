# Gemma4-26B-A4B WMDP-Cyber forget-only TRACE, checkpoint round.
# Non-algorithm hyperparameters aligned with open-unlearning
# main/main-cyber/gemma4/configs-r1/grad_diff.yaml (see interns2 twin for
# the full alignment list): lr 5e-6, gbs 32, 10 epochs, wd 0, betas
# 0.9/0.999, eps 1e-8, clip 1.0, cosine + min_lr 1e-6 + 5% warmup, seed 42,
# bf16. adam_beta2=0.999 and the explicit cosine floor/warmup are ALIGNMENT
# changes vs the TRACE bio runs (0.95 / inherited defaults). mb stays 4
# (TRACE selected-expert training is proven at mb4); global_batch_size ==
# micro_batch_size * DP == 4*8 kept from the online-eval round so the layout
# matches the validated 2026-10-04 run exactly.
# Checkpoint round (2026-10-04, user): online eval OFF; save ONLY the final
# step-230 checkpoint under the main-cyber weights root.
# Gemma-specific choices carried over from the nocap/BOS analysis:
#   model  = nocap shadow dir (final_logit_softcapping removed; the capped
#            arms only measured the 60-nat NLL ceiling, 2026-09-30 audit);
#   caches = the BOS tokenization set on BOTH streams (gemma4_*_bos /
#            fineweb_edu_5b_gemma4_*_bos_seed42) -- BOS is Gemma-only,
#            Intern-S2/Qwen use the plain caches.
model:
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true

data:
  # Cyber forget cache (BOS variant): 748 packs. Gemma4: 30 routed layers x
  # 128 experts, top-K=8, hidden 2816; shared expert = per-layer dense MLP
  # (excluded from selection, frozen), exactly like Qwen3.5's shared_expert.
  forget_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/gemma4_wmdp_cyber_softpack4096_bos/forget
  retain_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false

# 8 GPUs: TP(1) * PP(1) * CP(1) * DP(8) = 8; ETP(1) * EP(8) = 8 expert
# groups, 128/8=16 routed experts per rank. full recompute is mandatory at
# mb4 (null/selective OOM'd at ~134.6 GiB on 2026-09-30; full is proven at
# 68.7-84.7 GiB peak). The explicit tensor/pipeline/context_parallel: 1 keys
# date from the online-eval round; kept so the layout stays identical to the
# validated 2026-10-04 run.
parallel:
  world_size: 8
  tensor_parallel: 1
  pipeline_parallel: 1
  context_parallel: 1
  expert_parallel: 8
  expert_tensor_parallel: 1
  sequence_parallel: false
  activation_recompute: full
  use_distributed_optimizer: true

optimizer:
  learning_rate: 5.0e-6
  weight_decay: 0.0
  gradient_clip: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  # Aligned with grad_diff.yaml: cosine floor and 5% warmup.
  min_learning_rate: 1.0e-6
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0

training:
  micro_batch_size: 4
  global_batch_size: 32
  # 748 forget packs / 32 = 23 steps per epoch; 10 epochs pinned to 230
  # (same schedule as the online-eval round).
  train_steps: 230
  num_train_epochs: 10
  seed: 42
  bf16: true
  output_dir: outputs/gemma4_26b_a4b_wmdp_cyber_forget1_lr5e-6_ep10_ep8_mb4_gb32_nocap_bos_forgetonly

trace:
  # Cyber-BOS selection landed 2026-10-04 (safer2ai 4xH200,
  # trace-gemma4-cyber-selection-safer2ai-77391776): 270/3840 experts,
  # threshold 0.1794 -- a genuinely different set from bio's 362 (BOS
  # tokenization changes routing), hence the separate _bos selection.
  selection_metadata: outputs/gemma4_wmdp_cyber_softpack4096_bos_expert_selection/metadata.json
  # Forget-only ablation (unchanged TRACE algorithm hyperparameters).
  lambda_forget: 1.0
  lambda_retain: 0.0
  gamma: 1.0e-5
  pgd_learning_rate: 700
  pgd_max_steps: 200
  pgd_tolerance: 1.0e-6
  alpha_min: 1.0
  moe_grouped_gemm: false
  # Weights root for the main-cyber line (user-specified 2026-10-04): the
  # final checkpoint lands at <root>/<run_name>/checkpoint-230.
  checkpoint_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
  resume_from: null
  # Save ONLY the final checkpoint (step 230 = 10 epochs): native + HF export,
  # no intermediate epochs.
  save_checkpoints: true
  checkpoint_cadence: steps
  checkpoint_steps: [230]
