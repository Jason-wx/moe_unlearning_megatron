# Gemma4 main-cyber grad-diff configuration (R2 save-point round).
# Derived from configs-r1/grad_diff.yaml by
# main/main-cyber/gemma4/make_configs_r2.py - the ONLY deltas vs R1 are
# the run name (-r2- infix) and the save plan; the schedule is re-run in
# full (10 epochs / 230 steps).
# R2 save point: ONE checkpoint at step 161 (epoch 7) -
# the margin-best point of the R1 curve (margin = mmlu - wmdp_cyber,
# argmax, earliest step wins ties; R1 readout there: 0.259/0.721).
# save_final_checkpoint stays false.
# R1: 0.259/0.721 (+0.462)@161 - the BOS-fix positive control, first
# real logit-level transfer on gemma4. mmlu erodes after ep7 (0.711 by
# 230), so the save point is also the mmlu knee.
# Everything else is byte-identical to the R1 config: model
# gemma-26b-a4b-nocap + BOS caches, lr (5e-6 / NPO family 5e-5), mbs /
# eval-bs tiers, the [23..230] per-epoch eval grid (748 packs -> 23
# steps per epoch), seed 42, shared main-cyber output_root. R2 run
# dirs / jsonls are name-distinct from R1 (gemma4-main-cyber-r2-*).
name: gemma4-main-cyber-r2-grad-diff
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_cyber_softpack4096_bos/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: grad_diff
  gamma: 1.0
  alpha: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-main-cyber-r2-grad-diff
  save_steps: [161]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 1
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      activation_recompute: full
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # Eval bs 16 (unchanged from bio): the step-1 eval forward at 64 OOMs
      # (~30.7 GiB full-vocab eval logits + ~115 GiB static; bio-line
      # evidence 2026-09-24). Static footprint is dataset-independent.
      batch_size: 16
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/gemma4/online-evaluation/r3
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
