# Gemma4 main-cyber rmu configuration (R2 save-point round).
# Derived from configs-r1/rmu.yaml by
# main/main-cyber/gemma4/make_configs_r2.py - the ONLY deltas vs R1 are
# the run name (-r2- infix) and the save plan; the schedule is re-run in
# full (10 epochs / 230 steps).
# R2 save point: ONE checkpoint at step 92 (epoch 4) -
# the margin-best point of the R1 curve (margin = mmlu - wmdp_cyber,
# argmax, earliest step wins ties; R1 readout there: 0.265/0.743).
# save_final_checkpoint stays false.
# R1 readout at the save point: 0.265/0.743 (margin +0.478); the curve
# flattens into a 0.271-0.281 band after ep4, so 92 is a stable plateau
# pick, not a knife-edge.
# Everything else is byte-identical to the R1 config: model
# gemma-26b-a4b-nocap + BOS caches, lr (5e-6 / NPO family 5e-5), mbs /
# eval-bs tiers, the [23..230] per-epoch eval grid (748 packs -> 23
# steps per epoch), seed 42, shared main-cyber output_root. R2 run
# dirs / jsonls are name-distinct from R1 (gemma4-main-cyber-r2-*).
name: gemma4-main-cyber-r2-rmu
model:
  name: gemma4
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true
data:
  name: wmdp_cyber
  forget_cache: ${OU_CACHE_ROOT}/Xtuner/gemma4_wmdp_cyber_softpack4096_bos/forget
  retain_cache: ${OU_CACHE_ROOT}/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false
algorithm:
  name: rmu
  gamma: 1.0
  alpha: 4.45
  target_layer: 9
  train_layers: [7, 8, 9]
  steering_coeff: 1200.0
  control_norm_mode: fixed
  control_scale_coeff: 1.0
training:
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 10
  learning_rate: 5.0e-06
  weight_decay: 0.0
  min_learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  lr_warmup_ratio: 0.05
  lr_warmup_init: 0.0
  lr_decay_steps: auto
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  gradient_clip: 1.0
  seed: 42
  bf16: true
  trainable_param_mode: full
  save_every_epoch: false
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_name: gemma4-main-cyber-r2-rmu
  save_steps: [92]
  save_interval_steps: 0
  save_final_checkpoint: false
  wandb_mode: offline
backends:
  megatron:
    enabled: true
    output_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/unlearn/megatron/main-cyber
    micro_batch_size: 4
    parallel:
      world_size: 8
      tensor_parallel: 1
      pipeline_parallel: 1
      context_parallel: 1
      expert_parallel: 8
      expert_tensor_parallel: 1
      sequence_parallel: false
      # RMU extracts and backprops from layer 9. Full-layer checkpointing runs
      # that hook under no-grad and detaches the RMU loss; keep it disabled.
      activation_recompute: null
      use_distributed_optimizer: true
    reference:
      allocation: same_as_student
      frozen: true
      logit_window_microbatches: 2
    evaluation:
      enabled: true
      tasks: [wmdp_cyber, mmlu]
      num_fewshot: 0
      # WMDP-Cyber remains full-size (1987 questions); MMLU uses 35 questions
      # per leaf subtask.
      task_limits: {mmlu: 35}
      # 32 (not the bio line's 64): cyber prompts are longer and RMU keeps a
      # frozen reference resident; V-cyber ran clean at 32. Fall back to 16
      # only if the first evaluation forward hits CUDA OOM.
      batch_size: 32
      output_dir: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/main/main-cyber/gemma4/online-evaluation
      steps: [23, 46, 69, 92, 115, 138, 161, 184, 207, 230]
