model:
  # Shadow directory over the same jincheng weights with
  # final_logit_softcapping removed (config.json null, weights symlinked).
  # Pointing model.path here is the only switch needed to disable the output
  # softcap: AutoConfig reads null -> bridge skips the tanh, and the exported
  # checkpoints copy this config, so downstream lm-eval is uncapped too.
  # Baseline reference for this line (nocap): wmdp_bio 0.7879 / mmlu 0.7449.
  # Root cause doc: open-unlearning/main/gemma4/GA_family_softcap_analysis_20260930.md
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/gemma/gemma-26b-a4b-nocap
  num_experts: 128
  trust_remote_code: true

data:
  # 2026-10-04 BOS round: both streams switched to the BOS tokenization set
  # (bos_per_pack: true), matching the cyber round's finding that the 10-01
  # nocap collapse was BOS-dependent -- lm-eval scores WITH BOS, the old
  # caches trained WITHOUT it. Same pack counts, so steps are unchanged.
  forget_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/gemma4_wmdp_bio_softpack4096_bos/forget
  retain_cache: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/fineweb_edu_5b_gemma4_softpack4096_bos_seed42
  sequence_length: 4096
  pad_token_id: 0
  shuffle: false

# Gemma4-26B-A4B: 30 routed layers x 128 experts, top-K=8, hidden 2816. The
# shared expert is the per-layer dense MLP (intermediate 2112 vs routed 704)
# and stays excluded from selection and frozen, exactly like Qwen3.5's
# shared_expert. The validated memory-safe TP1/EP8 layout applies: 26B bf16 is
# lighter per rank than Qwen3.5-35B, while hidden 2816 (vs 2048) raises
# activation memory ~1.4x under full recompute.
# 8 GPUs: TP(1) * PP(1) * CP(1) * DP(8) = 8.
# Expert groups: ETP(1) * EP(8) * PP(1) * expert-DP(1) = 8.
# Each rank owns 128/8=16 routed experts per layer.
parallel:
  world_size: 8
  tensor_parallel: 1
  pipeline_parallel: 1
  context_parallel: 1
  expert_parallel: 8
  expert_tensor_parallel: 1
  sequence_parallel: false
  # 2026-09-30: both null and selective OOM'd on the first forward step at
  # ~134.6 GiB allocated (safethm jobs ...-nocap-saf-ee882 / ...-db7e7);
  # selective does not cover the bridge's MoE dispatch path, so it saved no
  # meaningful memory. "full" checkpoints every layer individually and is
  # proven at 84.7 GiB peak in the capped arms.
  activation_recompute: full
  use_distributed_optimizer: true

optimizer:
  # nocap arm at the interns2-recipe lr. The two capped arms (lr 5e-6 and
  # 1e-6, both wmdp_bio ~0.75-0.77) measured the softcap ceiling, not TRACE;
  # with the cap removed the forget objective has no NLL ceiling.
  learning_rate: 1.0e-6
  weight_decay: 0.0
  gradient_clip: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8

training:
  # DP(8) * micro_batch(4), with one microbatch per optimizer step.
  micro_batch_size: 4
  global_batch_size: 32
  train_steps: -1
  num_train_epochs: 3
  seed: 42
  bf16: true
  # Renamed ..._nocap -> ..._nocap_bos for this round: the non-BOS nocap run's
  # report/artifacts live under the old name and must not be clobbered.
  output_dir: outputs/gemma4_26b_a4b_wmdp_bio_forget1_lr1e-6_ep3_ep8_mb4_gb32_nocap_bos_forgetonly

trace:
  # 2026-10-04 BOS round: BOS tokenization changes activations and therefore
  # routing, so the old non-BOS selection (362/3840, capped weights) was
  # deleted and must be re-run on the BOS cache against the nocap weights
  # (configs/expert_selection/gemma4_wmdp_bio_softpack4096_bos.yaml).
  # Preflight fails here until the new metadata lands at this path.
  selection_metadata: outputs/gemma4_wmdp_bio_softpack4096_bos_expert_selection/metadata.json
  # Forget-only ablation: the retain objective is disabled. The current
  # implementation still constructs and solves the retain calibration problem,
  # then multiplies its weighted retain loss by zero.
  lambda_forget: 1.0
  lambda_retain: 0.0
  gamma: 1.0e-5
  pgd_learning_rate: 700
  pgd_max_steps: 200
  pgd_tolerance: 1.0e-6
  alpha_min: 1.0
  moe_grouped_gemm: false
  checkpoint_root: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/wangxiao1/checkpoints/Trace
  resume_from: null
  # Training still runs the full 3 epochs (num_train_epochs: 3), but only the
  # FIRST-epoch checkpoint is exported: step 711 for the 22,757-pack forget
  # cache with global batch size 32 (epoch boundaries are 711, 1422, 2133).
  # This is the checkpoint we actually keep for this line; the step-1422 and
  # step-2133 exports are intentionally skipped. To restore per-epoch exports,
  # set checkpoint_cadence: epoch and checkpoint_steps: [].
  save_checkpoints: true
  checkpoint_cadence: steps
  checkpoint_steps: [711]
