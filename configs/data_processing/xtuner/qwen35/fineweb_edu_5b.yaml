# XTuner soft packing of FineWeb-Edu 5B for Qwen3.5 (same 92-shard source as
# the Intern-S2 / Gemma4 FineWeb caches).
tokenizer:
  path: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/sgtm/internal/checkpoints/qwen/qwen3p5-35b-a3b
  trust_remote_code: true

dataset:
  files: /mnt/shared-storage-gpfs2/wenxiaoyu-gpfs02/jincheng/data/fineweb-edu-5b-shuffle/*.parquet
  format: parquet
  text_key: text
  sample_ratio: 1.0
  filter_empty: true
  max_documents: null

packing:
  seed: 42
  pack_level: soft
  pack_max_length: 4096
  pack_to_max_length: true
  pack_chunk_size: 10000
  pack_workers: 4
  pack_extra_buffer_size: 100
  global_pack: false
  add_eos_token: true
  add_bos_token: false

build:
  tokenize_workers: 64
  tokenize_batch_size: 1024
  show_progress: true

output:
  directory: /mnt/shared-storage-user/safethm-share/wangxiao1/Safe_MoE/open-unlearning/data_cache/Xtuner/fineweb_edu_5b_qwen35_softpack4096_seed42
  overwrite: false
