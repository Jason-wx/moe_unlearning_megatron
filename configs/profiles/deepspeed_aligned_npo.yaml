training:
  global_batch_size: 128
  train_steps: 1344
  num_train_epochs: 1
  learning_rate: 1.0e-6
  weight_decay: 0.0
  min_learning_rate: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  gradient_clip: 0.0
  seed: 42
  bf16: true
  trainable_param_mode: moe_experts
  save_every_epoch: true
  wandb_project: OpenUnlearning
  wandb_dir: ${OU_WANDB_ROOT}
  output_dir: ${OU_CHECKPOINT_ROOT}/interns2-pure-npo
